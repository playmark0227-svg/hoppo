name: Firebase safety checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix functions
      - run: node scripts/check-secrets.cjs
      - run: npm audit --omit=dev --prefix functions --audit-level=moderate
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Start local browser test server
        run: nohup python3 -m http.server 8776 --bind 127.0.0.1 > /tmp/hoppo-http.log 2>&1 &
      - name: Verify rules, integration and real browser registration recovery
        run: npx firebase emulators:exec --project demo-hoppo --only auth,firestore,functions 'node scripts/verify.cjs'
